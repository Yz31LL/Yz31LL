<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Yzeill Joshua Kyle Torres - animated space header">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="45%" stop-color="#0b1030"/>
      <stop offset="100%" stop-color="#12042a"/>
    </linearGradient>
    <radialGradient id="neb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b8cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#8ea2ff"/>
      <stop offset="55%" stop-color="#4359c9"/>
      <stop offset="100%" stop-color="#1a1150"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6ecff"/>
      <stop offset="50%" stop-color="#9db8ff"/>
      <stop offset="100%" stop-color="#c4a8ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .star{fill:#ffffff}
      .tw{animation:tw 3s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
      .role{font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif;font-size:20px;fill:#8fb0ff;opacity:0;letter-spacing:2px}
      .role{animation:roleCycle 14s infinite}
      @keyframes roleCycle{0%{opacity:0}3%{opacity:1}22%{opacity:1}25%{opacity:0}100%{opacity:0}}
      .name{font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif;font-weight:bold;font-size:40px;letter-spacing:1px}
      .shoot{stroke:#ffffff;stroke-width:2;stroke-linecap:round}
    </style>
  </defs>

  <rect width="900" height="240" fill="url(#sky)"/>
  <ellipse cx="180" cy="70" rx="320" ry="180" fill="url(#neb1)"/>
  <ellipse cx="720" cy="200" rx="300" ry="170" fill="url(#neb2)"/>

  <!-- starfield -->
  <g>
    <circle class="star tw" cx="40"  cy="40"  r="1.4" style="animation-delay:0s;animation-duration:2.6s"/>
    <circle class="star tw" cx="95"  cy="150" r="1"   style="animation-delay:1.1s;animation-duration:3.4s"/>
    <circle class="star tw" cx="130" cy="60"  r="1.7" style="animation-delay:.4s;animation-duration:2.9s"/>
    <circle class="star tw" cx="200" cy="120" r="1"   style="animation-delay:2s;animation-duration:3.1s"/>
    <circle class="star tw" cx="250" cy="35"  r="1.3" style="animation-delay:.8s;animation-duration:2.4s"/>
    <circle class="star tw" cx="300" cy="180" r="1.5" style="animation-delay:1.6s;animation-duration:3.6s"/>
    <circle class="star tw" cx="360" cy="90"  r="1"   style="animation-delay:.2s;animation-duration:2.8s"/>
    <circle class="star tw" cx="420" cy="200" r="1.4" style="animation-delay:2.4s;animation-duration:3s"/>
    <circle class="star tw" cx="470" cy="50"  r="1.1" style="animation-delay:1.3s;animation-duration:2.5s"/>
    <circle class="star tw" cx="520" cy="160" r="1.6" style="animation-delay:.6s;animation-duration:3.3s"/>
    <circle class="star tw" cx="560" cy="30"  r="1"   style="animation-delay:1.9s;animation-duration:2.7s"/>
    <circle class="star tw" cx="610" cy="110" r="1.3" style="animation-delay:.9s;animation-duration:3.5s"/>
    <circle class="star tw" cx="640" cy="205" r="1.2" style="animation-delay:2.2s;animation-duration:2.6s"/>
    <circle class="star tw" cx="690" cy="55"  r="1.5" style="animation-delay:.3s;animation-duration:3.2s"/>
    <circle class="star tw" cx="820" cy="40"  r="1"   style="animation-delay:1.5s;animation-duration:2.9s"/>
    <circle class="star tw" cx="860" cy="130" r="1.4" style="animation-delay:.7s;animation-duration:3.4s"/>
    <circle class="star tw" cx="750" cy="185" r="1.1" style="animation-delay:2.1s;animation-duration:2.5s"/>
    <circle class="star tw" cx="30"  cy="200" r="1.3" style="animation-delay:1.2s;animation-duration:3.1s"/>
    <circle class="star tw" cx="160" cy="205" r="1"   style="animation-delay:.5s;animation-duration:2.8s"/>
    <circle class="star tw" cx="880" cy="90"  r="1.2" style="animation-delay:1.8s;animation-duration:3.3s"/>
  </g>

  <!-- shooting stars -->
  <line class="shoot" x1="0" y1="0" x2="34" y2="10">
    <animateTransform attributeName="transform" type="translate" from="120 -20" to="520 150" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.6;.75;1" dur="6s" repeatCount="indefinite"/>
  </line>
  <line class="shoot" x1="0" y1="0" x2="30" y2="8">
    <animateTransform attributeName="transform" type="translate" from="500 -20" to="880 120" dur="9s" begin="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.55;.7;1" dur="9s" begin="3s" repeatCount="indefinite"/>
  </line>

  <!-- ringed planet + orbiting moon (right side) -->
  <g transform="translate(795,120)">
    <ellipse cx="0" cy="0" rx="46" ry="14" fill="none" stroke="#7c88d8" stroke-width="3" opacity="0.6" transform="rotate(-20)"/>
    <circle r="26" fill="url(#planet)"/>
    <ellipse cx="0" cy="0" rx="46" ry="14" fill="none" stroke="#aeb8ff" stroke-width="3" opacity="0.85" transform="rotate(-20)" stroke-dasharray="60 200"/>
    <circle r="4" fill="#dfe6ff">
      <animateMotion dur="7s" repeatCount="indefinite" path="M 0 -40 a 40 40 0 1 0 0.1 0 z"/>
    </circle>
  </g>

  <!-- name -->
  <text class="name" x="60" y="112" fill="url(#nameGrad)" filter="url(#glow)">Yzeill Joshua Kyle Torres</text>
  <line x1="62" y1="128" x2="470" y2="128" stroke="#3a4aa0" stroke-width="1.5" opacity="0.7"/>

  <!-- cycling roles -->
  <g>
    <text class="role" x="64" y="162" style="animation-delay:0s">&gt; Full-Stack AI Software Engineer</text>
    <text class="role" x="64" y="162" style="animation-delay:3.5s">&gt; Machine Learning Engineer</text>
    <text class="role" x="64" y="162" style="animation-delay:7s">&gt; Geospatial AI/ML</text>
    <text class="role" x="64" y="162" style="animation-delay:10.5s">&gt; Building RAG systems &amp; ML pipelines</text>
  </g>
</svg>
